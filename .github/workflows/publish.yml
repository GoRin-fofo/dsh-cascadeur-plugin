name: Publish

# 触发：推 v* tag（正式发版）或手动 dispatch。
#
# 认证二选一：
#   A) npm OIDC 可信发布（推荐，不存 token）：
#      npmjs.com → 包设置 → Trusted Publisher → GitHub Actions
#      user/repo: GoRin-fofo/dsh-cascadeur-plugin
#      workflow:  publish.yml
#      environment: 留空
#      然后在 npmjs.com 删掉仓库里的 NPM_TOKEN secret（或保持为空）。
#   B) 传统 token：在仓库 Settings → Secrets 里加 NPM_TOKEN（Automation token）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 建 GitHub Release
  id-token: write   # OIDC 可信发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 11 (Node 24) is required for OIDC trusted publishing
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::git tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version ok: $VERSION"

      - name: Tests
        run: |
          node tests/test_core.mjs
          node tests/test_packaging.mjs

      - name: Is this version already on npm?
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-cascadeur-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "already on npm; will only create the GitHub Release"
            echo "already=yes" >> "$GITHUB_OUTPUT"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with NPM_TOKEN (if configured)
        if: ${{ env.NPM_TOKEN != '' && steps.published.outputs.already == 'no' }}
        run: npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with OIDC trusted publisher
        if: ${{ env.NPM_TOKEN == '' && steps.published.outputs.already == 'no' }}
        run: npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
